<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>初一数学浅奥题 · 交互练习</title>
<style>
  :root {
    --accent: #4f46e5;
    --accent-soft: #eef2ff;
    --bg: #f6f7fb;
    --card: #ffffff;
    --text: #1f2937;
    --muted: #6b7280;
    --border: #e5e7eb;
    --green: #16a34a;
    --green-soft: #dcfce7;
    --amber: #d97706;
    --amber-soft: #fef3c7;
    --red: #dc2626;
    --red-soft: #fee2e2;
    --radius: 14px;
    --shadow: 0 1px 3px rgba(16,24,40,.06), 0 4px 16px rgba(16,24,40,.05);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.8;
    font-size: 16px;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Header ---------- */
  .header {
    position: sticky;
    top: 0;
    z-index: 20;
    background: rgba(255,255,255,.9);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }
  .header-inner {
    max-width: 880px;
    margin: 0 auto;
    padding: 14px 20px 12px;
  }
  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .title-block h1 {
    font-size: 1.35rem;
    font-weight: 700;
    letter-spacing: .02em;
  }
  .title-block .subtitle {
    font-size: .82rem;
    color: var(--muted);
  }
  .header-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .live-progress {
    font-size: .9rem;
    font-weight: 600;
    color: var(--accent);
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .progress-track {
    margin-top: 10px;
    height: 8px;
    background: #e9ecf5;
    border-radius: 999px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #6366f1, #4f46e5);
    border-radius: 999px;
    transition: width .5s cubic-bezier(.4,0,.2,1);
  }

  /* ---------- Buttons ---------- */
  .btn {
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    padding: 6px 14px;
    border-radius: 999px;
    font-size: .85rem;
    font-family: inherit;
    cursor: pointer;
    transition: all .15s ease;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .btn:active { transform: scale(.97); }
  .btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .btn-primary:hover { background: #4338ca; color: #fff; }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------- Filter tabs ---------- */
  .filters {
    max-width: 880px;
    margin: 18px auto 4px;
    padding: 0 20px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }
  .tab-row {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 4px;
    scrollbar-width: none;
  }
  .tab-row::-webkit-scrollbar { display: none; }
  .tab {
    flex: 0 0 auto;
    border: 1px solid var(--border);
    background: var(--card);
    padding: 6px 14px;
    border-radius: 999px;
    font-size: .85rem;
    cursor: pointer;
    color: var(--muted);
    transition: all .15s ease;
    white-space: nowrap;
  }
  .tab:hover { border-color: var(--accent); color: var(--accent); }
  .tab.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 600;
  }
  .filter-divider { width: 1px; height: 22px; background: var(--border); margin: 0 4px; flex: 0 0 auto; }

  /* ---------- Cards ---------- */
  .cards {
    max-width: 880px;
    margin: 14px auto 40px;
    padding: 0 20px;
    display: grid;
    gap: 14px;
  }
  .card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px 22px;
    border-left: 4px solid #cbd5e1;
    transition: border-color .2s ease;
  }
  .card[data-status="会"]    { border-left-color: var(--green); }
  .card[data-status="半会"]  { border-left-color: var(--amber); }
  .card[data-status="不会"]  { border-left-color: var(--red); }

  .card-head {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }
  .num {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 30px;
    height: 30px;
    padding: 0 8px;
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 700;
    font-size: .9rem;
    border-radius: 999px;
  }
  .tag {
    font-size: .75rem;
    color: var(--muted);
    background: #f3f4f6;
    border-radius: 6px;
    padding: 2px 8px;
  }
  .status-label {
    margin-left: auto;
    font-size: .78rem;
    font-weight: 600;
    color: var(--muted);
  }
  .card[data-status="会"] .status-label   { color: var(--green); }
  .card[data-status="半会"] .status-label { color: var(--amber); }
  .card[data-status="不会"] .status-label { color: var(--red); }

  .question {
    font-size: 1.02rem;
    color: var(--text);
  }
  .question .frac {
    display: inline-block;
    vertical-align: middle;
    text-align: center;
    margin: 0 3px;
    line-height: 1.1;
  }
  .question .frac .top { display: block; border-bottom: 1px solid currentColor; padding: 0 4px 1px; }
  .question .frac .bot { display: block; padding: 1px 4px 0; }

  /* ---------- Answer reveal ---------- */
  .reveal-wrap {
    margin-top: 14px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .answer {
    display: none;
    margin-top: 14px;
    background: var(--accent-soft);
    border: 1px solid #e0e7ff;
    border-radius: 10px;
    padding: 14px 16px;
    font-size: .95rem;
    animation: slideIn .25s ease;
  }
  .answer.open { display: block; }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .answer .a-line { margin-bottom: 6px; }
  .answer .a-line:last-child { margin-bottom: 0; }
  .answer b { color: var(--accent); }
  .answer .sol b { color: var(--muted); }

  /* ---------- Rating ---------- */
  .rating {
    margin-top: 14px;
    display: flex;
    gap: 8px;
  }
  .rating .r-btn {
    flex: 1;
    max-width: 130px;
    border: 1px solid var(--border);
    background: var(--card);
    padding: 6px 0;
    border-radius: 8px;
    font-size: .88rem;
    font-family: inherit;
    cursor: pointer;
    color: var(--muted);
    transition: all .15s ease;
  }
  .rating .r-btn:hover { border-color: #9ca3af; }
  .rating .r-btn[aria-pressed="true"].r-master { background: var(--green-soft); border-color: var(--green); color: var(--green); font-weight: 600; }
  .rating .r-btn[aria-pressed="true"].r-half   { background: var(--amber-soft); border-color: var(--amber); color: var(--amber); font-weight: 600; }
  .rating .r-btn[aria-pressed="true"].r-no     { background: var(--red-soft);   border-color: var(--red);   color: var(--red);   font-weight: 600; }

  /* ---------- Stats ---------- */
  .stats {
    max-width: 880px;
    margin: 0 auto 48px;
    padding: 0 20px;
  }
  .stats-inner {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 16px 22px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .stats-numbers { display: flex; gap: 18px; font-size: .9rem; flex-wrap: wrap; }
  .stats-numbers .k { color: var(--muted); font-size: .78rem; display: block; }
  .stats-numbers .v { font-weight: 700; font-size: 1.15rem; }
  .stats-numbers .s-master .v { color: var(--green); }
  .stats-numbers .s-pending .v { color: var(--amber); }
  .stats-numbers .s-empty .v { color: var(--muted); }
  .stats-actions { display: flex; gap: 8px; }
  .btn-danger { color: var(--red); border-color: #fecaca; }
  .btn-danger:hover { background: var(--red-soft); color: var(--red); border-color: var(--red); }

  /* ---------- Empty state ---------- */
  .empty {
    text-align: center;
    color: var(--muted);
    padding: 60px 20px;
    font-size: .95rem;
  }
  .empty::before {
    content: "";
    display: block;
    width: 48px;
    height: 48px;
    margin: 0 auto 14px;
    border-radius: 50%;
    background: var(--accent-soft);
  }

  /* ---------- Print-only title ---------- */
  .print-title { display: none; }

  /* ---------- Responsive ---------- */
  @media (max-width: 640px) {
    body { font-size: 15px; }
    .header-inner, .cards, .filters, .stats { padding-left: 14px; padding-right: 14px; }
    .card { padding: 16px; }
    .rating .r-btn { max-width: none; }
  }

  /* ---------- Print stylesheet (练习卷：只有题目，无答案无交互) ---------- */
  @media print {
    body { background: #fff; font-size: 12pt; line-height: 1.7; }
    .header { position: static; backdrop-filter: none; background: #fff; border-bottom: 2px solid #000; }
    .header-inner { padding: 12px 0; }
    .title-block h1 { font-size: 16pt; }
    .subtitle { display: block; }
    .progress-track, .header-actions, .live-progress, .filters, .reveal-wrap,
    .answer, .rating, .stats, .tag, .status-label { display: none !important; }
    .print-title {
      display: block;
      text-align: center;
      font-size: 14pt;
      font-weight: 700;
      margin: 8px 0 4px;
    }
    .cards { max-width: 100%; margin: 12px 0 0; padding: 0; display: block; }
    .card {
      box-shadow: none;
      border: 1px solid #999;
      border-left: 1px solid #999;
      border-radius: 0;
      padding: 12px 14px;
      margin-bottom: 10px;
      break-inside: avoid;
      page-break-inside: avoid;
    }
    .card-head { margin-bottom: 6px; }
    .num { background: none; color: #000; border: 1px solid #000; border-radius: 999px; }
    .question { font-size: 12pt; }
    .stats-inner { display: none; }
  }
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div class="print-title">初一数学浅奥题 · 练习卷（人教版）</div>
    <div class="header-top">
      <div class="title-block">
        <h1>初一数学浅奥题 · 交互练习</h1>
        <div class="subtitle">人教版 · 20 题 · 8 大专题</div>
      </div>
      <div class="header-actions">
        <span class="live-progress" id="liveProgress">已掌握 0 / 20</span>
        <button class="btn" id="btnShowAll" type="button">显示全部答案</button>
        <button class="btn btn-primary" id="btnPrint" type="button">打印练习卷</button>
      </div>
    </div>
    <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progressTrack">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>
</header>

<nav class="filters" aria-label="题目筛选">
  <div class="tab-row" id="topicTabs"></div>
  <div class="filter-divider"></div>
  <div class="tab-row" id="statusTabs"></div>
</nav>

<main class="cards" id="cards"></main>

<section class="stats" aria-label="学习统计">
  <div class="stats-inner">
    <div class="stats-numbers">
      <div class="s-master"><span class="k">已掌握</span><span class="v" id="stMaster">0</span></div>
      <div class="s-pending"><span class="k">待巩固</span><span class="v" id="stPending">0</span></div>
      <div class="s-empty"><span class="k">未作答</span><span class="v" id="stEmpty">20</span></div>
    </div>
    <div class="stats-actions">
      <button class="btn btn-danger" id="btnReset" type="button">重置进度</button>
    </div>
  </div>
</section>

<script>
"use strict";

/* ============ 题目数据 ============ */
/* 8 大专题 · 20 题。q=题目, a=答案, s=解析。数学符号使用 Unicode 与 <sup>/<sub>。 */
const TOPICS = ["有理数与绝对值", "整式与规律探究", "一元一次方程", "几何初步", "二元一次方程组", "不等式", "实数", "综合探究"];

const PROBLEMS = [
  { topic: 0, q: "已知 |a−3| + |b+2| = 0，求 a+b 的值。",
    a: "1", s: "绝对值非负，和为 0 则各项为 0 → a=3，b=−2 → a+b=1。" },
  { topic: 0, q: "计算：1/(1×2) + 1/(2×3) + 1/(3×4) + … + 1/(99×100)。",
    a: "99/100", s: "裂项：1/[n(n+1)] = 1/n − 1/(n+1)，前后抵消后只剩 1 − 1/100 = 99/100。" },
  { topic: 0, q: "已知 |x|=3，|y|=5，且 |x+y| = x+y，求 x−y 的所有可能值。",
    a: "−2 或 −8", s: "由 |x+y|=x+y 知 x+y≥0，只有 (3,5) 和 (−3,5) 两组 → 3−5=−2，−3−5=−8。" },
  { topic: 0, q: "有理数 a、b、c 满足 abc &lt; 0 且 a+b+c = 0，求 |a|/a + |b|/b + |c|/c 的值。",
    a: "1", s: "abc&lt;0 且和为 0 → 恰有一个负数（不可能全负）→ 两个 +1、一个 −1，和为 1。" },

  { topic: 1, q: "已知 x² + 2x − 1 = 0，求 2x² + 4x + 5 的值。",
    a: "7", s: "整体代入：x²+2x=1 → 2(x²+2x)+5 = 2+5 = 7。" },
  { topic: 1, q: "摆 1 个三角形需 3 根火柴，摆 2 个需 5 根，摆 3 个需 7 根……摆 n 个三角形（连成一排）需要多少根火柴？",
    a: "2n+1", s: "首项 3，每多一个三角形加 2 根 → 3+2(n−1) = 2n+1。" },
  { topic: 1, q: "当 x = 2 时，代数式 ax⁵ + bx³ + cx − 5 的值为 7，求 x = −2 时该代数式的值。",
    a: "−17", s: "ax⁵+bx³+cx 是奇函数：x=2 时为 12（12−5=7）→ x=−2 时为 −12−5 = −17。" },

  { topic: 2, q: "若方程 2(x−1) + 3 = 5 与方程 3x − a = 4 的解相同，求 a 的值。",
    a: "a = 2", s: "先解第一方程得 x=2，代入第二方程 6−a=4 → a=2。" },
  { topic: 2, q: "甲、乙两人从相距 42 km 的 A、B 两地同时相向而行，甲速 5 km/h，乙速 4 km/h。甲带一条狗，狗以 9 km/h 的速度在两人之间来回奔跑，直到两人相遇。狗共跑了多少千米？",
    a: "42 km", s: "狗跑的时间 = 两人相遇时间 = 42/(5+4) = 14/3 h → 狗跑 9 × 14/3 = 42 km。" },
  { topic: 2, q: "一项工程，甲单独做需 12 天，乙单独做需 18 天。两人合作 3 天后甲离开，余下的由乙单独完成，乙还需几天？",
    a: "10.5 天", s: "合作 3 天完成 (1/12+1/18)×3 = 5/12，剩 7/12，乙需 (7/12)÷(1/18) = 10.5 天。" },
  { topic: 2, q: "一个两位数，个位数字是十位数字的 2 倍；把十位与个位数字对调后，新数比原数大 18。求原数。",
    a: "24", s: "设十位 x、个位 2x → 原数 12x，对调后 21x → 21x−12x=18 → x=2 → 原数 24。" },

  { topic: 3, q: "线段 AB = 20，点 C 在 AB 上，AC = 3CB，M 为 BC 的中点，求 AM 的长。",
    a: "17.5", s: "AC=15、CB=5，M 为 BC 中点 → MC=2.5 → AM = 15+2.5 = 17.5。" },
  { topic: 3, q: "∠AOB = 90°，OC 平分 ∠AOB，OD 平分 ∠BOC，求 ∠AOD 的度数。",
    a: "67.5°", s: "∠AOC=45°，OD 平分 ∠BOC → ∠COD=22.5° → ∠AOD = 45°+22.5° = 67.5°。" },
  { topic: 3, q: "两条直线相交成四个角，其中一个角恰好是它的邻补角的 4 倍，求这四个角的度数。",
    a: "36°、144°、36°、144°", s: "邻补角：x+4x=180° → x=36°，另一对角为 144°，对顶角分别相等。" },

  { topic: 4, q: "解方程组：<br>2(x+1) − 3(y−1) = 13<br>3(x+1) + 2(y−1) = 13",
    a: "x = 4，y = 0", s: "换元：令 m=x+1、n=y−1 → 2m−3n=13、3m+2n=13 → m=5、n=−1 → x=4、y=0。" },
  { topic: 4, q: "学校组织 45 名师生划船，共租 11 条船，每条大船坐 5 人、小船坐 3 人，恰好坐满。大船、小船各租了几条？",
    a: "大船 6 条，小船 5 条", s: "x+y=11，5x+3y=45 → 2x=12 → x=6、y=5。" },

  { topic: 5, q: "若关于 x 的不等式 2x − a ≤ 0 只有 3 个正整数解，求 a 的取值范围。",
    a: "6 ≤ a &lt; 8", s: "x ≤ a/2，正整数解为 1、2、3 → 3 ≤ a/2 &lt; 4 → 6 ≤ a &lt; 8。" },
  { topic: 5, q: "某商场以每件 50 元的进价购进一批商品，标价 80 元。因滞销决定打折销售，但要保证利润率不低于 20%，该商品最多可以打几折？（利润率 = 利润 ÷ 进价）",
    a: "七五折", s: "最低售价 50×1.2 = 60 元 → 80x ≥ 60 → x ≥ 0.75 → 最多打七五折。" },

  { topic: 6, q: "已知一个正数的两个平方根分别是 2a+1 和 a−4，求这个正数。",
    a: "9", s: "两平方根互为相反数 → 2a+1 + a−4 = 0 → a=1 → 平方根 ±3 → 正数为 9。" },

  { topic: 7, q: "将自然数按如下规律排列：<br>第1行：1<br>第2行：2&nbsp;&nbsp;3<br>第3行：4&nbsp;&nbsp;5&nbsp;&nbsp;6<br>第4行：7&nbsp;&nbsp;8&nbsp;&nbsp;9&nbsp;&nbsp;10<br>……<br>问：(1) 第 10 行最左边的数是多少？(2) 100 在第几行、从左数第几个位置？",
    a: "(1) 46；(2) 第14行第9个", s: "第 n 行有 n 个数：前 13 行共 1+2+…+13 = 91 个数 → 第 14 行为 92,93,…,100 → 100 排第 9 个；第 10 行最左 = 前 9 行 45 个数 + 1 = 46。" }
];

/* ============ 状态 ============ */
const LS_KEY = "math20-ratings-v1";
let ratings = {};           // { id: "会"|"半会"|"不会" }
try { ratings = JSON.parse(localStorage.getItem(LS_KEY)) || {}; } catch (e) { ratings = {}; }

let topicFilter = "全部";
let statusFilter = "全部";

/* ============ DOM ============ */
const cardsEl = document.getElementById("cards");
const progressFill = document.getElementById("progressFill");
const progressTrack = document.getElementById("progressTrack");
const liveProgress = document.getElementById("liveProgress");
const stMaster = document.getElementById("stMaster");
const stPending = document.getElementById("stPending");
const stEmpty = document.getElementById("stEmpty");

/* ============ 渲染 ============ */
function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function buildTabs() {
  const topics = ["全部", ...TOPICS.map((t, i) => `${"一二三四五六七八"[i]}·${t}`)];
  const statuses = ["全部", "待巩固", "已掌握"];
  const tTab = document.getElementById("topicTabs");
  topics.forEach(name => {
    const b = document.createElement("button");
    b.className = "tab" + (name === topicFilter ? " active" : "");
    b.type = "button";
    b.textContent = name;
    b.setAttribute("aria-pressed", name === topicFilter);
    b.addEventListener("click", () => { topicFilter = name; render(); });
    tTab.appendChild(b);
  });
  const sTab = document.getElementById("statusTabs");
  statuses.forEach(name => {
    const b = document.createElement("button");
    b.className = "tab" + (name === statusFilter ? " active" : "");
    b.type = "button";
    b.textContent = name;
    b.setAttribute("aria-pressed", name === statusFilter);
    b.addEventListener("click", () => { statusFilter = name; render(); });
    sTab.appendChild(b);
  });
}

function topicNameOf(p) { return `${"一二三四五六七八"[p.topic]}·${TOPICS[p.topic]}`; }
function statusOf(id) { return ratings[id] || ""; }

function renderCards() {
  cardsEl.innerHTML = "";
  const visible = PROBLEMS.filter((p, i) => {
    const id = String(i + 1);
    const matchTopic = topicFilter === "全部" || topicNameOf(p) === topicFilter;
    const st = statusOf(id);
    const matchStatus =
      statusFilter === "全部" ||
      (statusFilter === "已掌握" && st === "会") ||
      (statusFilter === "待巩固" && (st === "半会" || st === "不会"));
    return matchTopic && matchStatus;
  });

  if (visible.length === 0) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "当前筛选条件下没有题目";
    cardsEl.appendChild(empty);
    return;
  }

  visible.forEach(p => {
    const id = String(PROBLEMS.indexOf(p) + 1);
    const st = statusOf(id);
    const card = document.createElement("article");
    card.className = "card";
    card.dataset.id = id;
    card.dataset.status = st || "未作答";

    const head = document.createElement("div");
    head.className = "card-head";
    head.innerHTML = `<span class="num">${id}</span><span class="tag">${esc(topicNameOf(p))}</span><span class="status-label">${st || "未作答"}</span>`;
    card.appendChild(head);

    const q = document.createElement("div");
    q.className = "question";
    q.innerHTML = p.q.replace(/\n/g, "<br>");
    card.appendChild(q);

    const reveal = document.createElement("div");
    reveal.className = "reveal-wrap";
    const btnAns = document.createElement("button");
    btnAns.className = "btn";
    btnAns.type = "button";
    btnAns.textContent = "查看答案";
    btnAns.setAttribute("aria-expanded", "false");
    btnAns.addEventListener("click", () => toggleAnswer(card, btnAns));
    reveal.appendChild(btnAns);
    card.appendChild(reveal);

    const ans = document.createElement("div");
    ans.className = "answer";
    ans.innerHTML = `<div class="a-line"><b>答案：</b>${p.a}</div><div class="a-line sol"><b>解析：</b>${p.s}</div>`;
    card.appendChild(ans);

    const rating = document.createElement("div");
    rating.className = "rating";
    ["会", "半会", "不会"].forEach(r => {
      const b = document.createElement("button");
      b.className = "r-btn " + (r === "会" ? "r-master" : r === "半会" ? "r-half" : "r-no");
      b.type = "button";
      b.textContent = r;
      b.setAttribute("aria-pressed", st === r);
      b.addEventListener("click", () => setRating(id, r === st ? "" : r));
      rating.appendChild(b);
    });
    card.appendChild(rating);

    cardsEl.appendChild(card);
  });
}

function toggleAnswer(card, btn) {
  const ans = card.querySelector(".answer");
  const open = ans.classList.toggle("open");
  btn.textContent = open ? "收起答案" : "查看答案";
  btn.setAttribute("aria-expanded", String(open));
}

function setRating(id, r) {
  if (r === "") delete ratings[id]; else ratings[id] = r;
  try { localStorage.setItem(LS_KEY, JSON.stringify(ratings)); } catch (e) {}
  render();
}

/* ============ 统计与进度 ============ */
function updateStats() {
  let m = 0, p = 0, e = 0;
  PROBLEMS.forEach((_, i) => {
    const st = statusOf(String(i + 1));
    if (st === "会") m++;
    else if (st === "半会" || st === "不会") p++;
    else e++;
  });
  stMaster.textContent = m;
  stPending.textContent = p;
  stEmpty.textContent = e;
  liveProgress.textContent = `已掌握 ${m} / ${PROBLEMS.length}`;
  const pct = Math.round((m / PROBLEMS.length) * 100);
  progressFill.style.width = pct + "%";
  progressTrack.setAttribute("aria-valuenow", String(pct));
}

function render() {
  buildTabsActive();
  renderCards();
  updateStats();
}

function buildTabsActive() {
  document.querySelectorAll("#topicTabs .tab").forEach(t => {
    const on = t.textContent === topicFilter;
    t.classList.toggle("active", on);
    t.setAttribute("aria-pressed", String(on));
  });
  document.querySelectorAll("#statusTabs .tab").forEach(t => {
    const on = t.textContent === statusFilter;
    t.classList.toggle("active", on);
    t.setAttribute("aria-pressed", String(on));
  });
}

/* ============ 全局操作 ============ */
document.getElementById("btnShowAll").addEventListener("click", function () {
  const allOpen = [...cardsEl.querySelectorAll(".answer")].every(a => a.classList.contains("open"));
  cardsEl.querySelectorAll(".card").forEach(card => {
    const ans = card.querySelector(".answer");
    const btn = card.querySelector(".reveal-wrap .btn");
    if (!allOpen) {
      ans.classList.add("open");
      btn.textContent = "收起答案";
      btn.setAttribute("aria-expanded", "true");
    } else {
      ans.classList.remove("open");
      btn.textContent = "查看答案";
      btn.setAttribute("aria-expanded", "false");
    }
  });
  this.textContent = allOpen ? "显示全部答案" : "隐藏全部答案";
});

document.getElementById("btnPrint").addEventListener("click", () => window.print());

document.getElementById("btnReset").addEventListener("click", function () {
  if (confirm("确定要清空所有作答进度吗？")) {
    ratings = {};
    try { localStorage.removeItem(LS_KEY); } catch (e) {}
    render();
  }
});

/* ============ 初始化 ============ */
buildTabs();
render();
</script>
</body>
</html>
